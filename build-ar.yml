name: Build Arabic page

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "build_ar.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build ar.html and sitemap.xml
        run: python build_ar.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ar.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto: rebuild Arabic page"
            git push
          fi
