<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiamo Mohamad — 3D World Portfolio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;color:#e8e6f0;font-family:'Segoe UI',system-ui,sans-serif}
  #canvas{position:fixed;inset:0;z-index:0}
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none}
  .topbar{position:fixed;top:0;left:0;right:0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto;z-index:3;background:linear-gradient(180deg,rgba(2,3,10,.7),transparent)}
  .brand{font-size:20px;font-weight:800;background:linear-gradient(120deg,#fff,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12px;backdrop-filter:blur(8px);transition:.2s}
  .nav button:hover{background:rgba(167,139,250,.25);border-color:#a78bfa}
  .panel{position:fixed;bottom:20px;left:20px;right:20px;max-width:520px;margin:auto;pointer-events:auto;background:rgba(8,10,18,.8);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 22px;backdrop-filter:blur(14px);z-index:3;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .panel h3{font-size:19px;margin-bottom:6px;background:linear-gradient(120deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel p{font-size:13px;opacity:.85;line-height:1.7}
  .panel .links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .panel .links a{color:#a78bfa;text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid rgba(167,139,250,.35);border-radius:8px;transition:.2s}
  .panel .links a:hover{background:rgba(167,139,250,.18)}
  .hint{position:fixed;bottom:20px;right:20px;font-size:11px;opacity:.45;z-index:3;pointer-events:none}
  #loading{position:fixed;inset:0;z-index:10;background:#02030a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #loading .bar{width:220px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#f472b6,#22d3ee);transition:width .25s}
  #loading .t{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div id="loading"><div class="bar"><i></i></div><div class="t">Building 3D World…</div></div>
<canvas id="canvas"></canvas>
<div class="topbar">
  <div class="brand">Tiamo Mohamad</div>
  <div class="nav" id="nav"></div>
</div>
<div class="panel" id="panel"><h3 id="ptitle">Welcome</h3><p id="pbody">Fly through the 3D world. Click any section to travel.</p><div class="links" id="plinks"></div></div>
<div class="hint">Drag to look · Scroll to zoom · Click nav/panel to travel</div>
<div id="brief" style="position:fixed;top:70px;right:20px;width:260px;background:rgba(8,10,18,.85);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;z-index:3;backdrop-filter:blur(12px);display:none">
  <h4 style="font-size:14px;margin-bottom:8px;color:#a78bfa">Brief Builder</h4>
  <div id="briefChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
  <textarea id="briefIdea" placeholder="Idea..." style="width:100%;height:60px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:6px;font-size:12px"></textarea>
  <button id="briefSend" style="margin-top:8px;width:100%;padding:8px;background:linear-gradient(120deg,#a78bfa,#f472b6);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px">Send on WhatsApp</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.032);
const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 300);
camera.position.set(0, 10, 34);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 5;
controls.maxDistance = 90;

// Lights
scene.add(new THREE.AmbientLight(0x303050, 0.55));
const pl = new THREE.PointLight(0xa78bfa, 2.2, 80); pl.position.set(12,18,12); scene.add(pl);
const pl2 = new THREE.PointLight(0xf472b6, 1.6, 60); pl2.position.set(-18,10,-12); scene.add(pl2);
const pl3 = new THREE.PointLight(0x22d3ee, 1.2, 50); pl3.position.set(0,-6,-20); scene.add(pl3);

// Starfield (2 layers)
function makeStars(n, size, opacity, spread){
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(n*3);
  for(let i=0;i<p.length;i++) p[i]=(Math.random()-0.5)*spread;
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  return new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff,size,transparent:true,opacity}));
}
scene.add(makeStars(2500,0.12,0.85,140));
scene.add(makeStars(800,0.25,0.6,90));

const sections = [
  {id:'hero', title:'Hero', titleAr:'الرئيسية', body:'Tiamo Mohamad — AI Artist, Photoshop Designer, Video Creator, VFX. Turning ideas into visual stories.', color:0xa78bfa, pos:[0,8,0], links:[['WhatsApp','https://wa.me/201278536645'],['Instagram','https://www.instagram.com/120tiamo120/']]},
  {id:'about', title:'About', titleAr:'نبذة', body:'Independent visual creator combining AI, Photoshop, compositing, color work and motion to build cinematic, modern, memorable visuals.', color:0x60a5fa, pos:[-16,3,-8], links:[]},
  {id:'services', title:'Services', titleAr:'الخدمات', body:'AI Art & Visuals · Photoshop & Manipulation · Reels & Ads · Cinematic Video & VFX · Video Editing · Graphic Design · Logo & Branding · Web Design · Book Covers · CV & Documents · Photo Restoration.', color:0x34d399, pos:[16,3,-8], links:[]},
  {id:'work', title:'Selected Work', titleAr:'أعمال مختارة', body:'AI art, photo manipulation, cinematic reels, VFX, advertising & design — presented with full-frame clarity.', color:0xf472b6, pos:[-12,-3,-16], links:[]},
  {id:'creation', title:'AI Creation', titleAr:'الإبداع بالذكاء', body:'Masonry wall of AI-generated visuals (l1.jpg …).', color:0xfbbf24, pos:[12,-3,-16], links:[]},
  {id:'beforeafter', title:'Before & After', titleAr:'قبل/بعد', body:'Photoshop transformations — veiled portrait, couple, old photo restoration.', color:0xfb923c, pos:[-8,-9,-24], links:[]},
  {id:'process', title:'Process', titleAr:'العملية', body:'Brief → Direction → Creation → Color & Details → Review → Delivery.', color:0x22d3ee, pos:[8,-9,-24], links:[]},
  {id:'findme', title:'Find Me', titleAr:'تواصل', body:'Facebook, Instagram, TikTok, YouTube, Photoshop Mode, Google Reviews.', color:0x8b5cf6, pos:[-18,9,-26], links:[['Facebook','https://www.facebook.com/tiamo.mohamad/'],['TikTok','https://www.tiktok.com/@tiamo.mohamad'],['YouTube','https://www.youtube.com/@tiamostudio']]},
  {id:'brief', title:'Start a Project', titleAr:'ابدأ مشروع', body:'Brief builder — services, usage, quantity, deadline, idea → WhatsApp message.', color:0x10b981, pos:[18,9,-26], links:[]},
  {id:'contact', title:'Contact', titleAr:'اتصال', body:'WhatsApp +20 12 7853 6645', color:0x10b981, pos:[0,14,-34], links:[['WhatsApp','https://wa.me/201278536645'],['Instagram','https://www.instagram.com/120tiamo120/']]}
];

const meshes = {};
const rings = {};
sections.forEach((s,i)=>{
  // Main box (glass-like)
  const geo = new THREE.BoxGeometry(4.6,2.8,0.35);
  const mat = new THREE.MeshPhysicalMaterial({color:s.color, emissive:s.color, emissiveIntensity:0.3, metalness:0.5, roughness:0.25, transparent:true, opacity:0.82, transmission:0.15, thickness:0.5});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...s.pos);
  scene.add(m);
  meshes[s.id]=m;
  // Glow ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.0,0.06,16,80), new THREE.MeshBasicMaterial({color:s.color, transparent:true, opacity:0.7}));
  ring.position.copy(m.position); ring.rotation.x = Math.PI/2;
  scene.add(ring); rings[s.id]=ring;
  // Inner orbiting sphere
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.35,24,24), new THREE.MeshStandardMaterial({color:0xffffff, emissive:s.color, emissiveIntensity:1.2}));
  orb.position.copy(m.position); orb.position.z += 0.4;
  scene.add(orb);
  m.userData.orb = orb;
  // Label sprite (EN + AR)
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.font='bold 40px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(s.title, 256, 46);
  ctx.font='22px system-ui'; ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText(s.titleAr, 256, 92);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(5.2,1.3,1); spr.position.copy(m.position); spr.position.y += 2.0;
  scene.add(spr);
  // Floating icon (simple geometric glyph)
  const iconGeo = new THREE.OctahedronGeometry(0.45,0);
  const icon = new THREE.Mesh(iconGeo, new THREE.MeshStandardMaterial({color:s.color, emissive:s.color, emissiveIntensity:0.8, metalness:0.6, roughness:0.2}));
  icon.position.copy(m.position); icon.position.y -= 1.8;
  scene.add(icon);
  m.userData.icon = icon;
});

// Connect sections with glowing tubes
for(let i=0;i<sections.length-1;i++){
  const a = new THREE.Vector3(...sections[i].pos);
  const b = new THREE.Vector3(...sections[i+1].pos);
  const curve = new THREE.CatmullRomCurve3([a, new THREE.Vector3((a.x+b.x)/2, (a.y+b.y)/2+3, (a.z+b.z)/2), b]);
  const tube = new THREE.TubeGeometry(curve, 24, 0.04, 8, false);
  scene.add(new THREE.Mesh(tube, new THREE.MeshBasicMaterial({color:0xa78bfa, transparent:true, opacity:0.35})));
}

// Particle clouds per section
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(1200*3);
for(let i=0;i<pPos.length;i++) pPos[i]=(Math.random()-0.5)*70;
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color:0xa78bfa,size:0.09,transparent:true,opacity:.55})));

// Image planes (load a few gallery images if present)
const imgPaths = ['images/tiamo-about.png','images/tiamo.jpg'];
imgPaths.forEach((p,idx)=>{
  const loader = new THREE.TextureLoader();
  loader.load(p, (tex)=>{
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(3,4), new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide}));
    plane.position.set(idx===0?-6:6, 0, -10);
    plane.rotation.y = idx===0?0.3:-0.3;
    scene.add(plane);
  }, undefined, ()=>{ /* missing image ignored */ });
});

// Nav buttons
const nav = document.getElementById('nav');
sections.forEach(s=>{
  const b = document.createElement('button'); b.textContent=s.title;
  b.onclick = ()=> travel(s.id);
  nav.appendChild(b);
});

const panel = document.getElementById('panel');
function showPanel(s){
  document.getElementById('ptitle').textContent = s.title + '  ·  ' + s.titleAr;
  document.getElementById('pbody').textContent = s.body;
  const links = document.getElementById('plinks'); links.innerHTML='';
  s.links.forEach(([name,url])=>{ const a=document.createElement('a'); a.textContent=name; a.href=url; a.target='_blank'; a.rel='noopener'; links.appendChild(a);});
}

function travel(id){
  const s = sections.find(x=>x.id===id);
  const target = new THREE.Vector3(...s.pos);
  const camTarget = target.clone().add(new THREE.Vector3(0,2.5,10));
  const start = camera.position.clone();
  const startT = controls.target.clone();
  let t=0;
  function step(){
    t+=0.035;
    if(t>=1){ camera.position.copy(camTarget); controls.target.copy(target); showPanel(s); return; }
    const e = t<0.5?2*t*t:-1+(4-2*t)*t;
    camera.position.lerpVectors(start, camTarget, e);
    controls.target.lerpVectors(startT, target, e);
    requestAnimationFrame(step);
  }
  step();
}

// Raycast hover/click
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
canvas.addEventListener('mousemove', e=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits = ray.intersectObjects(Object.values(meshes));
  Object.values(meshes).forEach(m=>m.material.emissiveIntensity=0.3);
  Object.values(rings).forEach(r=>r.material.opacity=0.7);
  if(hits.length){ hits[0].object.material.emissiveIntensity=1.0; const id=Object.keys(meshes).find(k=>meshes[k]===hits[0].object); rings[id].material.opacity=1.0; canvas.style.cursor='pointer'; }
  else canvas.style.cursor='grab';
});
canvas.addEventListener('click', e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits = ray.intersectObjects(Object.values(meshes));
  if(hits.length){
    const id = Object.keys(meshes).find(k=>meshes[k]===hits[0].object);
    travel(id);
  }
});

// ---- Before/After 3D slider ----
const baGroup = new THREE.Group();
const baBefore = new THREE.Mesh(new THREE.PlaneGeometry(6,7.5), new THREE.MeshBasicMaterial({color:0x222233, side:THREE.DoubleSide}));
const baAfter = new THREE.Mesh(new THREE.PlaneGeometry(6,7.5), new THREE.MeshBasicMaterial({color:0xa78bfa, side:THREE.DoubleSide, transparent:true, opacity:0.9}));
baBefore.position.set(0,0,0); baAfter.position.set(0,0,0.01);
const baDivider = new THREE.Mesh(new THREE.BoxGeometry(0.06,7.5,0.05), new THREE.MeshBasicMaterial({color:0xffffff}));
baDivider.position.set(0,0,0.02);
baGroup.add(baBefore, baAfter, baDivider);
baGroup.position.set(0,-9,-24);
baGroup.scale.set(0.7,0.7,0.7);
scene.add(baGroup);
let baDrag=false, baX=0;
canvas.addEventListener('pointerdown', e=>{ const r=canvas.getBoundingClientRect(); const mx=(e.clientX-r.left)/r.width*2-1; const my=-(e.clientY-r.top)/r.height*2+1; ray.setFromCamera({x:mx,y:my},camera); const hits=ray.intersectObject(baDivider); if(hits.length) baDrag=true; });
window.addEventListener('pointermove', e=>{ if(!baDrag) return; const r=canvas.getBoundingClientRect(); const mx=(e.clientX-r.left)/r.width; baX = (mx-0.5)*6; baX=Math.max(-3,Math.min(3,baX)); baDivider.position.x=baX; baAfter.material.opacity = 0.9; });
window.addEventListener('pointerup', ()=> baDrag=false);

// ---- Particle morph shapes (sphere/torus) ----
const morphGeo = new THREE.BufferGeometry();
const morphCount = 1500;
const morphPos = new Float32Array(morphCount*3);
const morphTarget = new Float32Array(morphCount*3);
for(let i=0;i<morphCount;i++){ const a=Math.random()*Math.PI*2, b=Math.acos(2*Math.random()-1); morphPos[i*3]=Math.sin(b)*Math.cos(a)*4; morphPos[i*3+1]=Math.sin(b)*Math.sin(a)*4; morphPos[i*3+2]=Math.cos(b)*4; }
morphGeo.setAttribute('position', new THREE.BufferAttribute(morphPos,3));
const morphPts = new THREE.Points(morphGeo, new THREE.PointsMaterial({color:0x22d3ee,size:0.06,transparent:true,opacity:.8}));
morphPts.position.set(8,-9,-24);
scene.add(morphPts);
function morphToTorus(){ for(let i=0;i<morphCount;i++){ const u=Math.random()*Math.PI*2, v=Math.random()*Math.PI*2; morphTarget[i*3]=(2+Math.cos(v))*Math.cos(u)*1.5; morphTarget[i*3+1]=(2+Math.cos(v))*Math.sin(u)*1.5; morphTarget[i*3+2]=Math.sin(v)*1.5; } }
morphToTorus();
let morphT=0;
function updateMorph(){ morphT+=0.01; const arr=morphGeo.attributes.position.array; for(let i=0;i<arr.length;i++){ arr[i]+=(morphTarget[i]-arr[i])*0.02; } morphGeo.attributes.position.needsUpdate=true; morphPts.rotation.y+=0.005; }

// ---- Brief builder UI ----
const briefServices = ['AI Art','Photoshop','Reels','VFX','Editing','Design','Logo','Web','CV','Restore'];
const briefChips = document.getElementById('briefChips');
const selected = new Set();
briefServices.forEach(s=>{ const b=document.createElement('button'); b.textContent=s; b.style.cssText='font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;cursor:pointer'; b.onclick=()=>{ if(selected.has(s)){selected.delete(s);b.style.background='rgba(255,255,255,.06)';}else{selected.add(s);b.style.background='rgba(167,139,250,.35)';} }; briefChips.appendChild(b); });
document.getElementById('briefSend').onclick=()=>{ const idea=document.getElementById('briefIdea').value; const msg=encodeURIComponent('Hello Tiamo 👋\\nServices: '+[...selected].join(', ')+'\\nIdea: '+idea); window.open('https://wa.me/201278536645?text='+msg,'_blank'); };
// toggle brief panel when traveling to brief section
const origTravel = travel;
// show brief panel on 'brief' travel
const _travel = travel;
travel = function(id){ _travel(id); document.getElementById('brief').style.display = (id==='brief')?'block':'none'; };

// Animate
let clock = 0;
function animate(){
  requestAnimationFrame(animate);
  clock += 0.016;
  controls.update();
  sections.forEach((s,i)=>{
    const m = meshes[s.id];
    m.rotation.y = Math.sin(clock*0.4+i)*0.15;
    m.rotation.x = Math.sin(clock*0.3+i*0.7)*0.08;
    const base = s.pos;
    m.position.y = base[1] + Math.sin(clock + i*0.9)*0.25;
    if(m.userData.orb){ m.userData.orb.position.copy(m.position); m.userData.orb.position.z += 0.45; m.userData.orb.rotation.y += 0.02; }
    if(m.userData.icon){ m.userData.icon.position.copy(m.position); m.userData.icon.position.y -= 1.9; m.userData.icon.rotation.y += 0.03; m.userData.icon.rotation.x = Math.sin(clock+i)*0.3; }
    rings[s.id].position.copy(m.position);
    rings[s.id].rotation.z += 0.01;
  });
  pl.position.x = Math.sin(clock*0.5)*12;
  pl2.position.z = Math.cos(clock*0.4)*12;
  updateMorph();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

setTimeout(()=>{ const L=document.getElementById('loading'); L.style.opacity='0'; L.style.transition='opacity .6s'; setTimeout(()=>L.style.display='none',600); travel('hero'); }, 700);
</script>
</body>
</html>
